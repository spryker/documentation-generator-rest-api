openapi: 3.0.0
info:
    title: API Platform
    version: 2.0.0
servers:
    - url: http://api-platform.local
tags:
    - name: ApiPlatform
      description: API Platform endpoints
paths:
    /api-platform-resource:
        get:
            tags:
                - ApiPlatform
            responses:
                '200':
                    description: ok
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SharedDifferent'
components:
    schemas:
        ApiPlatformOnly:
            type: object
            properties:
                name:
                    type: string
        SharedIdentical:
            type: object
            properties:
                id:
                    type: string
        SharedDifferent:
            type: object
            properties:
                api_platform_only_field:
                    type: string
    securitySchemes:
        ApiPlatformAuth:
            type: http
            scheme: bearer
    parameters: {}
